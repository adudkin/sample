services:
  frontend:
    build: ./frontend
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
      NGINX_ENVSUBST_FILTER: DOMAIN
    volumes:
      - type: bind
        source: ${TLS_DIRECTORY:-/etc/letsencrypt}
        target: /etc/letsencrypt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${ACME_WEBROOT:-./certbot-www}
        target: /var/www/certbot
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      - api
    restart: unless-stopped

  api:
    build: ./sample-server
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: sample
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PGDATABASE: sample
      PGSSLMODE: disable
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sample
      POSTGRES_USER: sample
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - sample-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sample -d sample"]
      interval: 2s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  sample-data:
