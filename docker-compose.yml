services:
  web:
    build: ./sample-server
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://sample:${POSTGRES_PASSWORD:-sample_local_dev}@db:5432/sample?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sample
      POSTGRES_USER: sample
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sample_local_dev}
    volumes:
      - sample-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sample -d sample"]
      interval: 2s
      timeout: 5s
      retries: 20
    restart: unless-stopped
volumes:
  sample-data:
